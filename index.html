      // Polyfill to resolve "Cannot set property fetch of #<Window> which has only a getter"
      // In certain iframe/sandboxed environments, Window.prototype.fetch or window.fetch
      // is provided with only a getter. When strict-mode scripts or libraries attempt
      // `window.fetch = ...` or `fetch = ...`, Chrome throws a TypeError.
      // Defining both getter and setter on Window.prototype, window, and globalThis resolves this.
      (function() {
        try {
          var _rawFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _fetchImpl = _rawFetch;

          function installFetchAccessor(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return _fetchImpl || _rawFetch;
                  },
                  set: function(fn) {
                    _fetchImpl = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (err) {}
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            installFetchAccessor(Window.prototype);
          }
          if (typeof window !== 'undefined') {
            installFetchAccessor(window);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            installFetchAccessor(globalThis);
          }

          // Suppress any stray unhandled error regarding fetch getter
          window.addEventListener('error', function(e) {
            if (e && e.message && e.message.includes('fetch') && e.message.includes('only a getter')) {
              e.preventDefault();
            }
          });
        } catch (e) {}
      })();
